services:
  - type: web
    name: swachh-track-hosted-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/v1/readyz
    envVars:
      - key: HOSTED_DEMO
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: STORAGE_DRIVER
        value: s3
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      # Dedicated fictional-demo PostgreSQL database and existing S3 bucket only.
      # Configure bucket privacy and browser PUT CORS separately; HEAD proves neither.
      # API_PUBLIC_URL can override Render's automatic HTTPS RENDER_EXTERNAL_URL.
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
