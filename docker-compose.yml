name: swachh-track
x-app: &app
  build: .
  image: swachh-track:0.1.0
  env_file: .env
  restart: unless-stopped
x-environment: &environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-swachh}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-swachh}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  STORAGE_DRIVER: s3
  NODE_ENV: development
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swachh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-swachh}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports: ["9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
  migrate:
    <<: *app
    restart: "no"
    environment: *environment
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    command: ["sh", "-c", "pnpm db:migrate && pnpm --filter @swachh/api storage:init && pnpm db:seed"]
  api:
    <<: *app
    environment: *environment
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    environment: *environment
    command: ["pnpm", "--filter", "@swachh/api", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    <<: *app
    environment:
      <<: *environment
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-false}
    command: ["pnpm", "--filter", "@swachh/web", "dev", "--hostname", "0.0.0.0"]
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres:
  redis:
  minio:
